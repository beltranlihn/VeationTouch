<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>VEATION Touch</title>
<link rel="icon" href="brand/veation-marca-pequena.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/screens.css">
<script src="js/boot-guard.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><img src="brand/veation-marca-pequena.svg" alt=""><span class="brand-name">VEATION <b>Touch</b></span></div>
    <div class="sep"></div>
    <label class="profile-pick" title="Room profile">
      <span class="lbl">Room</span>
      <select id="profileSelect"></select>
    </label>
    <div class="grow"></div>
    <div class="chips" id="chips"></div>
    <div class="problems" id="problems"></div>
    <div class="seg" id="projSeg" title="What the projection shows">
      <button data-mode="off">Off</button><button data-mode="identify" title="Each wall's grid, id and zones, drawn through its Mapping">Pattern</button><button data-mode="debug" title="The live touches">Debug</button>
    </div>
    <button class="btn" id="lockBtn" title="Show mode: lock the room against accidental edits">Show</button>
    <button class="btn" id="connectBtn" title="Calibrate from a phone or tablet at the wall">Connect device</button>
  </header>

  <div class="body">
    <!-- Three sections (keys 1 · 2 · 3). data-home = the sub-tab a section opens on the first time; after that, its last one. -->
    <nav class="nav" id="nav">
      <button data-section="live" data-home="live" title="Live (1)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M10 9.5v5l4.5-2.5z"/></svg><span>Live</span></button>
      <button data-section="output" data-home="mapping" title="Output (2)"><svg viewBox="0 0 24 24"><path d="M4 12h12M12 7l5 5-5 5"/><path d="M20 4v16"/></svg><span>Output</span></button>
      <button data-section="setup" data-home="status" title="System &amp; Calibration (3)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg><span>System &amp; Calibration</span></button>
    </nav>

    <main class="stage">
      <!-- The sub-tabs of each section; every data-view is one view id (app.js routes it). Live has none. -->
      <div class="subnav" id="subnav" hidden>
        <div class="subtabs" data-section="output" hidden>
          <span class="lbl">Output</span>
          <div class="well" role="tablist" aria-label="Output">
            <button data-view="mapping" role="tab">Screens</button><button data-view="audio" role="tab">Audio</button><button data-view="outputs" role="tab">Protocols</button>
          </div>
        </div>
        <div class="subtabs" data-section="setup" hidden>
          <span class="lbl">System &amp; Calibration</span>
          <div class="well" role="tablist" aria-label="System &amp; Calibration">
            <button data-view="status" role="tab">Status</button><button data-view="room" role="tab">Room</button><button data-view="sensors" role="tab">Sensors</button><button data-view="calibrate" role="tab">Calibrate</button><button data-view="zones" role="tab">Zones</button><button data-view="system" role="tab">System</button>
          </div>
        </div>
      </div>
      <div class="ctl-banner" id="ctlBanner" hidden></div>
      <div class="view-wrap">
        <canvas id="roomCanvas"></canvas>
        <canvas id="room3d" hidden></canvas>
        <div class="ws-bar" id="wsBar"></div>
        <div class="stage-hint" id="stageHint"></div>
        <div class="stage-caption" id="xpCaption" hidden></div>
        <div class="stage-tools">
          <button class="ibtn" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
          <button class="ibtn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button>
          <button class="ibtn" id="fitBtn" title="Fit to view (double-click)">Fit</button>
          <button class="ibtn tog" id="pointsBtn" title="Show raw LiDAR points">Points</button>
          <button class="ibtn tog" id="contentBtn" title="Show the content image under the walls (upload it in Output › Screens)" hidden>Content</button>
          <button class="ibtn tog" id="expBtn" title="Show the experience on the walls, simulated in this window (not the room's output)" hidden>Experience</button>
        </div>
      </div>
    </main>

    <aside class="panel" id="panel"></aside>
  </div>

  <footer class="status" id="statusBar"></footer>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toasts" id="toasts"></div>
<div class="conn-lost" id="connLost" hidden><div><b id="connLostTitle">Connection to the engine lost</b><span id="connLostText">Reconnecting…</span></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
