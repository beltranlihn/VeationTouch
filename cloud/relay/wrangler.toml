# VEATION Touch relay — Cloudflare Workers (free plan: Durable Objects must be SQLite-backed).
#   npx wrangler deploy        (run from this folder)
name = "veation-relay"
main = "worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true     # https://veation-relay.<account>.workers.dev
preview_urls = false   # no per-version preview addresses

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomRelay"]
